name: Build Yimmi Kambio Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          mkdir -p android/app/src/main/assets

      - name: Sync web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Apply centered Futuro Ahora app icon
        run: |
          curl -fsSL "https://i.postimg.cc/qqPkkZH3/20261116-035439-0000.png" -o /tmp/futuro_logo_raw.png

          for dir in android/app/src/main/res/mipmap-*; do
            [ -d "$dir" ] || continue
            for target in "$dir"/ic_launcher.png "$dir"/ic_launcher_round.png "$dir"/ic_launcher_foreground.png; do
              if [ -f "$target" ]; then
                w=$(identify -format "%w" "$target")
                h=$(identify -format "%h" "$target")
                inner_w=$((w * 54 / 100))
                inner_h=$((h * 54 / 100))
                convert /tmp/futuro_logo_raw.png \
                  -resize "${inner_w}x${inner_h}" \
                  -background "#ffffff" \
                  -gravity center \
                  -extent "${w}x${h}" \
                  -alpha off \
                  "$target"
              fi
            done
          done

          if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yimmi-Kambio-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
