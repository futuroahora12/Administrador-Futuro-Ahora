            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            font-family: 'JetBrains Mono', monospace;

        .app-shell {
            width: 100%;

            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background:
                radial-gradient(circle at 12% 0%, var(--app-ring), transparent 45%),
                radial-gradient(circle at 88% 10%, rgba(59, 130, 246, 0.16), transparent 45%),
                #0b0e1c;
            box-shadow: 0 0 0 1px var(--app-ring), var(--app-glow);
        }

        html:not(.dark) .app-shell {
            background:
                radial-gradient(circle at 12% 0%, var(--app-badge-light-bg), transparent 45%),

        }

        .app-surface {
            background: rgba(18, 22, 41, 0.90);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            color: #f8fafc;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        html:not(.dark) .app-surface {
            background: #ffffff;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid var(--app-badge-light-border);
            color: #0f172a;
            box-shadow: 0 6px 18px -10px rgba(15, 23, 42, 0.18);
        }

        .app-title {
            color: #ffffff;
        }

        html:not(.dark) .app-title {
            color: #0f172a;
        }

        .app-muted {
            color: #94a3b8;
        }

        html:not(.dark) .app-muted {
            color: #475569;
        }

        .app-accent {
            color: var(--app-accent-dark);
        }

        html:not(.dark) .app-accent {
            color: var(--app-accent-light);
        }

        .app-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--app-ring);
            color: var(--app-accent-dark);
        }

        html:not(.dark) .app-chip {
            background: var(--app-badge-light-bg);
            border: 1px solid var(--app-badge-light-border);
            color: var(--app-accent-light);
        }

        .app-subcard {
            background: rgba(8, 11, 24, 0.65);
            border: 1px solid var(--app-ring);
        }

        html:not(.dark) .app-subcard {
            background: #f8fafc;
            border: 1px solid var(--app-badge-light-border);
        }

        .app-input {
            background: rgba(8, 11, 24, 0.80);
            border: 1px solid rgba(148, 163, 184, 0.24);
            color: #f8fafc;
            min-height: 46px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        html:not(.dark) .app-input {
            background: #f1f5f9;
            border: 1px solid rgba(15, 23, 42, 0.22);
            color: #0f172a;
        }

        html:not(.dark) .app-input::placeholder {
            color: #64748b;
        }

        .app-input:focus {
            outline: none;
            border-color: var(--app-primary);
            box-shadow: 0 0 0 2px var(--app-ring);
        }

        .app-btn-primary {
            background: linear-gradient(135deg, var(--app-secondary) 0%, var(--app-primary) 100%);
            box-shadow: var(--app-glow);
            color: var(--app-on-action);
            min-height: 46px;
            transition: transform 0.12s ease, filter 0.15s ease;
        }

        .app-btn-primary:active {
            transform: scale(0.98);
            filter: brightness(1.06);
        }

        .app-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--app-ring);
            color: #f1f5f9;
            min-height: 44px;
        }

        html:not(.dark) .app-btn-secondary {
            background: #f1f5f9;
            border: 1px solid var(--app-badge-light-border);
            color: #0f172a;
        }

        .app-touch {
            min-height: 44px;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }

        .app-touch:active {
            transform: scale(0.97);

        .app-banner {
            border-radius: 22px;
            padding: 16px 18px;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--app-deep) 0%, var(--app-secondary) 55%, var(--app-primary) 100%);
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: var(--app-glow);
        }

        @keyframes splashProgress4s {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes splashFloat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .anim-splash-4s {
            animation: splashProgress4s 4s linear forwards;
        }

        .anim-splash-logo {
            animation: splashFloat 1.6s ease-in-out infinite;
        }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--app-secondary), var(--app-primary));
            border-radius: 9999px;
        }
    </style>
</head>

    <!-- Script Principal con Firebase y Lógica de Administración Completa -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-analytics.js";
        import { getDatabase, ref, set, onValue, update, remove, push, runTransaction } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAee29RNZa3A-C-8APC1x_yMzViMgR7bBA",
            authDomain: "futuro-ahora.firebaseapp.com",
            databaseURL: "https://futuro-ahora-default-rtdb.firebaseio.com",
            projectId: "futuro-ahora",
            storageBucket: "futuro-ahora.firebasestorage.app",
            messagingSenderId: "727564715444",
            appId: "1:727564715444:web:0c4d66d7c2260daaeddee1",
            measurementId: "G-EDDTRWG6VV"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        window.fb = { db, ref, set, onValue, update, remove, push, runTransaction };

        const STORAGE_ADMIN_SESION = 'futuro_admin_sesion_dispositivo_v1';
        const STORAGE_ADMIN_PIN = 'futuro_admin_pin_v1';

        let subiendoArchivoPinPausa = false;
        let pausaArchivoTimeout = null;

        function pausarBloqueoPinPorArchivo(duracionMs = 15000) {
            subiendoArchivoPinPausa = true;
            if (pausaArchivoTimeout) clearTimeout(pausaArchivoTimeout);
            pausaArchivoTimeout = setTimeout(() => {
                subiendoArchivoPinPausa = false;
            }, duracionMs);
        }

        function liberarPausaArchivoPinPronto() {
            if (pausaArchivoTimeout) clearTimeout(pausaArchivoTimeout);
            pausaArchivoTimeout = setTimeout(() => {
                subiendoArchivoPinPausa = false;
            }, 1200);
        }

        document.addEventListener('click', function(ev) {
            const fileInput = ev.target && ev.target.closest ? ev.target.closest('input[type="file"]') : null;
            if (fileInput) {
                pausarBloqueoPinPorArchivo(20000);
            }
        }, true);

        document.addEventListener('change', function(ev) {
            const fileInput = ev.target && ev.target.closest ? ev.target.closest('input[type="file"]') : null;
            if (fileInput) {
                liberarPausaArchivoPinPronto();
            }
        }, true);

        window.addEventListener('focus', function() {
            if (subiendoArchivoPinPausa) {
                liberarPausaArchivoPinPronto();
            }
        });

        const TARJETAS_FUTURO_QR_DEFAULT = {
            bono_unico_laboral: {
                titulo: "Bono Unico Laboral (Noviembre 2026)",
                subtitulo: "Lista de trabajadores · Envíos al admin"
            },
            bonificacion_ubii: {
                titulo: "Bonificacion UbiiApp",
                subtitulo: "Lista de trabajadores · Envíos al admin"
            },
            bono_complementario_nomina: {
                titulo: "Bono Complementario de Nomina",
                subtitulo: "Lista de trabajadores · Envíos al admin"
            },
            consulta_cedula: {
                titulo: "Consulta por cedula",
                subtitulo: "Verifica nombres y apellidos por cédula"
            },
            registro_trabajador: {
                titulo: "Registro de trabajador",
                subtitulo: "Registra cédula, nombres y apellidos"
            }
        };

        const TEMAS_ADMIN = {
            "purpura":  { label: "Púrpura Neón",  primary: "#a855f7", secondary: "#3b82f6", deep: "#312e81", ring: "rgba(168, 85, 247, 0.38)", glow: "0 10px 28px -8px rgba(168, 85, 247, 0.45)", onAction: "#ffffff", accentDark: "#d8b4fe", accentLight: "#6d28d9", lightBg: "rgba(109, 40, 217, 0.12)", lightBorder: "rgba(109, 40, 217, 0.28)" },
            "azul":     { label: "Azul Neón",     primary: "#38bdf8", secondary: "#2563eb", deep: "#172554", ring: "rgba(56, 189, 248, 0.38)",  glow: "0 10px 28px -8px rgba(37, 99, 235, 0.45)",  onAction: "#ffffff", accentDark: "#7dd3fc", accentLight: "#1d4ed8", lightBg: "rgba(29, 78, 216, 0.12)",  lightBorder: "rgba(29, 78, 216, 0.28)" },
            "verde":    { label: "Verde Neón",    primary: "#10b981", secondary: "#059669", deep: "#064e3b", ring: "rgba(16, 185, 129, 0.38)",  glow: "0 10px 28px -8px rgba(16, 185, 129, 0.45)",  onAction: "#ffffff", accentDark: "#6ee7b7", accentLight: "#047857", lightBg: "rgba(4, 120, 87, 0.12)",   lightBorder: "rgba(4, 120, 87, 0.28)" },
            "rosado":   { label: "Rosado Neón",   primary: "#ec4899", secondary: "#a855f7", deep: "#500724", ring: "rgba(236, 72, 153, 0.38)",  glow: "0 10px 28px -8px rgba(236, 72, 153, 0.45)",  onAction: "#ffffff", accentDark: "#f9a8d4", accentLight: "#be185d", lightBg: "rgba(190, 24, 93, 0.12)",  lightBorder: "rgba(190, 24, 93, 0.28)" },
            "rojo":     { label: "Rojo Neón",     primary: "#f43f5e", secondary: "#dc2626", deep: "#4c0519", ring: "rgba(244, 63, 94, 0.38)",   glow: "0 10px 28px -8px rgba(244, 63, 94, 0.45)",   onAction: "#ffffff", accentDark: "#fda4af", accentLight: "#be123c", lightBg: "rgba(190, 18, 60, 0.12)",  lightBorder: "rgba(190, 18, 60, 0.28)" },
            "amarillo": { label: "Amarillo Neón", primary: "#eab308", secondary: "#d97706", deep: "#422006", ring: "rgba(234, 179, 8, 0.40)",   glow: "0 10px 28px -8px rgba(217, 119, 6, 0.42)",   onAction: "#ffffff", accentDark: "#fde047", accentLight: "#a16207", lightBg: "rgba(161, 98, 7, 0.13)",   lightBorder: "rgba(161, 98, 7, 0.30)" },
            "celeste":  { label: "Celeste Neón",  primary: "#06b6d4", secondary: "#0284c7", deep: "#083344", ring: "rgba(6, 182, 212, 0.38)",   glow: "0 10px 28px -8px rgba(2, 132, 199, 0.45)",   onAction: "#ffffff", accentDark: "#67e8f9", accentLight: "#0e7490", lightBg: "rgba(14, 116, 144, 0.12)", lightBorder: "rgba(14, 116, 144, 0.28)" }
        };

        const ADMIN_TABS = {
            'trabajadores':     { label: 'Trabajadores', icon: 'fa-users' },
            'whitelist':        { label: 'Cédulas',      icon: 'fa-id-card' },
            'blog':             { label: 'Blog',         icon: 'fa-bullhorn' },
            'kambio':           { label: 'Kambio',       icon: 'fa-coins' },
            'contenido':        { label: 'Anuncios',     icon: 'fa-circle-question' },
            'bonos':            { label: 'Bonos',        icon: 'fa-gift' },
            'futuroQR':         { label: 'ValidaFuturo', icon: 'fa-check-double' },
            'creditos':         { label: 'Créditos',     icon: 'fa-hand-holding-dollar' },
            'pagosAdmin':       { label: 'Pagos',        icon: 'fa-receipt' },
            'constanciasAdmin': { label: 'Constancias',  icon: 'fa-file-invoice' },
            'chatsAdmin':       { label: 'Chats',        icon: 'fa-comments' },
            'notificaciones':   { label: 'Notif',        icon: 'fa-bell' },
            'config':           { label: 'Config',       icon: 'fa-gear' }
        };

        const MOBILE_BOTTOM_TABS = ['trabajadores', 'whitelist', 'bonos', 'futuroQR'];
        const MOBILE_MORE_TABS = ['kambio', 'blog', 'contenido', 'creditos', 'pagosAdmin', 'constanciasAdmin', 'chatsAdmin', 'notificaciones', 'config'];

        function cargarTemaAdminLocal() {
            try {
                const t = localStorage.getItem('futuro_admin_tema');
                return t && TEMAS_ADMIN[t] ? t : 'purpura';
            } catch (e) {
                return 'purpura';
            }
        }

        function aplicarTemaAdmin(id) {
            const t = TEMAS_ADMIN[id] || TEMAS_ADMIN.purpura;
            const root = document.documentElement;
            root.style.setProperty('--app-primary', t.primary);
            root.style.setProperty('--app-secondary', t.secondary);
            root.style.setProperty('--app-deep', t.deep);
            root.style.setProperty('--app-ring', t.ring);
            root.style.setProperty('--app-glow', t.glow);
            root.style.setProperty('--app-on-action', t.onAction);
            root.style.setProperty('--app-accent-dark', t.accentDark);
            root.style.setProperty('--app-accent-light', t.accentLight);
            root.style.setProperty('--app-badge-light-bg', t.lightBg);
            root.style.setProperty('--app-badge-light-border', t.lightBorder);
        }

        function cargarSesionDispositivo() {
            try {
                const raw = localStorage.getItem(STORAGE_ADMIN_SESION);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (parsed && parsed.email) {
                    return { nombre: 'Administrador General', email: parsed.email, role: 'admin' };
                }
            } catch (e) {}
            return null;
        }

        function guardarSesionDispositivo(email) {
            try {
                localStorage.setItem(STORAGE_ADMIN_SESION, JSON.stringify({ email, guardadoEn: Date.now() }));
            } catch (e) {}
        }

        function limpiarSesionDispositivo() {
            try {
                localStorage.removeItem(STORAGE_ADMIN_SESION);
                sessionStorage.removeItem('futuro_current_admin');
            } catch (e) {}
        }

        function cargarPinGuardado() {
            try {
                const pin = localStorage.getItem(STORAGE_ADMIN_PIN);
                return pin && /^\d{4}$/.test(pin) ? pin : '';
            } catch (e) {
                return '';
            }
        }

        function guardarPinDispositivo(pin) {
            try {
                localStorage.setItem(STORAGE_ADMIN_PIN, pin);
            } catch (e) {}
        }

        function limpiarPinDispositivo() {
            try {
                localStorage.removeItem(STORAGE_ADMIN_PIN);
            } catch (e) {}
        }

        window.toggleTemaMenu = function() {
            window.state.temaMenuOpen = !window.state.temaMenuOpen;
            window.render();
        };

        window.seleccionarTemaAdmin = function(id) {
            if (!TEMAS_ADMIN[id]) return;
            window.state.temaId = id;
            try { localStorage.setItem('futuro_admin_tema', id); } catch (e) {}
            aplicarTemaAdmin(id);
            window.state.temaMenuOpen = false;
            window.showToast('Tema: ' + TEMAS_ADMIN[id].label, 'success');
            window.render();
        };

        function bloquearAppConPin() {
            if (subiendoArchivoPinPausa) return;
            if (!window.state.currentUser) return;
            const pinGuardado = cargarPinGuardado();
            if (!pinGuardado) return;
            if (!window.state.pinLocked) {
                window.state.pinLocked = true;
                window.state.mobileMenuOpen = false;
                window.state.temaMenuOpen = false;
                window.state.pinEntrada = '';
                window.state.pinError = '';
                window.cerrarAdminWorkerModal();
                if (window.state.splashDone) {
                    window.render();
                }
            }
        }

        window.pulsarDigitoPin = function(digito) {
            const d = String(digito || '').replace(/\D/g, '').slice(0, 1);
            if (!d) return;
            const actual = String(window.state.pinEntrada || '');
            if (actual.length >= 4) return;
            window.state.pinEntrada = actual + d;
            window.state.pinError = '';
            window.render();

            if (window.state.pinEntrada.length === 4) {
                setTimeout(() => {
                    window.validarPinDesbloqueo();
                }, 120);
            }
        };

        window.borrarDigitoPin = function() {
            const actual = String(window.state.pinEntrada || '');
            window.state.pinEntrada = actual.slice(0, -1);
            window.state.pinError = '';
            window.render();
        };

        window.limpiarPinEntrada = function() {
            window.state.pinEntrada = '';
            window.state.pinError = '';
            window.render();
        };

        window.validarPinDesbloqueo = function() {
            const entrada = String(window.state.pinEntrada || '').trim();
            const pinGuardado = cargarPinGuardado();
            if (!pinGuardado) {
                window.state.pinLocked = false;
                window.render();
                return;
            }
            if (entrada === pinGuardado) {
                window.state.pinLocked = false;
                window.state.pinEntrada = '';
                window.state.pinError = '';
                window.showToast('Sesión desbloqueada.', 'success');
                window.render();
            } else {
                window.state.pinEntrada = '';
                window.state.pinError = 'PIN incorrecto. Intenta de nuevo.';
                window.render();
            }
        };

        window.cerrarSesionCompletaDispositivo = function() {
            limpiarSesionDispositivo();
            window.state.currentUser = null;
            window.state.pinLocked = false;
            window.state.configurandoPin = false;
            window.state.pinNuevo = '';
            window.state.pinConfirmar = '';
            window.state.pinEntrada = '';
            window.state.pinError = '';
            window.state.mobileMenuOpen = false;
            window.state.temaMenuOpen = false;
            window.state.view = 'loginAdmin';
            window.cerrarAdminWorkerModal();
            window.render();
        };

        window.restablecerPinEnBloqueo = function() {
            limpiarPinDispositivo();
            limpiarSesionDispositivo();
            window.state.currentUser = null;
            window.state.pinLocked = false;
            window.state.configurandoPin = false;
            window.state.pinNuevo = '';
            window.state.pinConfirmar = '';
            window.state.pinEntrada = '';
            window.state.pinError = '';
            window.state.view = 'loginAdmin';
            window.showToast('PIN restablecido. Inicia sesión de nuevo.', 'success');
            window.render();
        };

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bloquearAppConPin();
            }
        });

        window.addEventListener('pagehide', () => {
            bloquearAppConPin();
        });

        document.addEventListener('pause', () => {
            bloquearAppConPin();
        }, false);

        document.addEventListener('backbutton', (ev) => {
            if (!window.state.splashDone) {
                ev.preventDefault();
                ev.stopPropagation();
                return;
            }
            if (window.state.pinLocked || window.state.configurandoPin) {
                ev.preventDefault();
                ev.stopPropagation();
                return;
            }
            const modal = document.getElementById('admin-worker-modal');
            if (modal && !modal.classList.contains('hidden')) {
                ev.preventDefault();
                ev.stopPropagation();
                window.cerrarAdminWorkerModal();
                return;
            }

        window.formatCurrencyInput = function(input) {

            let partes = numero.split('.');
            partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");

        function obtenerTituloPorTipoBono(tipoBono) {

                return tc.bonificacion_ubii?.titulo || TARJETAS_FUTURO_QR_DEFAULT.bonificacion_ubii.titulo;
            }
            if (tipoBono === 'bono_complementario_nomina') {
                return tc.bono_complementario_nomina?.titulo || TARJETAS_FUTURO_QR_DEFAULT.bono_complementario_nomina.titulo;

            return tc.bono_unico_laboral?.titulo || TARJETAS_FUTURO_QR_DEFAULT.bono_unico_laboral.titulo;
        }

        function obtenerListaValidacionesQR() {
            const lista = [];
            const rawPend = window.state.enviosPendientesAdmin || {};
            Object.entries(rawPend).forEach(([tipoBono, porCedula]) => {
                if (!porCedula || typeof porCedula !== 'object') return;
                Object.entries(porCedula).forEach(([cedulaKey, item]) => {
                    if (!item || typeof item !== 'object') return;
                    const ced = normalizarCedulaAdmin(item.cedula || cedulaKey);
                    const tipoFinal = item.tipoBono || tipoBono;
                    lista.push({
                        id: `${tipoFinal}__${ced}`,
                        pushKey: '',
                        tipoBono: tipoFinal,
                        bono: item.bono || obtenerTituloPorTipoBono(tipoFinal),
                        cedula: ced,
                        nombreCompleto: item.nombreCompleto || 'Trabajador Futuro Ahora',
                        monto: parseFloat(item.monto) || 0,
                        estadoAdmin: item.estadoAdmin || 'pendiente_foto_y_envio',
                        fotoBono: item.fotoBono || '',
                        hora: item.hora || '',
                        enviadoEn: item.enviadoEn || '',
                        creadoEn: item.creadoEn || ''
                    });
                });
            });

            if (lista.length === 0 && window.state.validacionesBonos && typeof window.state.validacionesBonos === 'object') {
                Object.entries(window.state.validacionesBonos).forEach(([pushKey, item]) => {
                    if (!item || typeof item !== 'object') return;
                    const ced = normalizarCedulaAdmin(item.cedula);
                    const tipoFinal = item.tipoBono || 'bono_unico_laboral';
                    lista.push({
                        id: pushKey,
                        pushKey,
                        tipoBono: tipoFinal,
                        bono: item.bono || obtenerTituloPorTipoBono(tipoFinal),
                        cedula: ced,
                        nombreCompleto: item.nombreCompleto || 'Trabajador Futuro Ahora',
                        monto: parseFloat(item.monto) || 0,
                        estadoAdmin: item.estadoAdmin || 'pendiente_foto_y_envio',
                        fotoBono: item.fotoBono || '',
                        hora: item.hora || '',
                        enviadoEn: item.enviadoEn || '',
                        creadoEn: item.creadoEn || ''
                    });
                });
            }

            return lista.sort((a, b) => (b.creadoEn || '').localeCompare(a.creadoEn || ''));
        }

        window.adminConfirmarEnvioBonoQR = function(tipoBono, cedula) {
            const ced = normalizarCedulaAdmin(cedula);
            if (!tipoBono || !ced) return;

            const claveItem = `${tipoBono}__${ced}`;
            const actualItem = window.state.enviosPendientesAdmin?.[tipoBono]?.[ced] || {};
            const fotoElegida = window.state.fotosBonoSeleccionadas[claveItem] || actualItem.fotoBono || '';
            const montoRaw = window.state.montosBonoQR[claveItem] ?? actualItem.monto ?? '';
            const montoNum = parseMontoAdmin(montoRaw);

            if (isNaN(montoNum) || montoNum <= 0) {
                window.showToast('Ingresa el monto del bono en Bs. mayor a 0.', 'error');
                return;
            }

            if (!fotoElegida) {
                window.showToast('Primero carga la foto del bono antes de confirmar el envío.', 'error');
                return;
            }

            const updates = {};
            const enviadoIso = new Date().toISOString();
            const nombreBono = actualItem.bono || obtenerTituloPorTipoBono(tipoBono);
            const montoRedondeado = Number(montoNum.toFixed(2));

            updates[`enviosPendientesAdmin/${tipoBono}/${ced}`] = {
                ...actualItem,
                tipoBono,
                cedula: ced,
                monto: montoRedondeado,
                fotoBono: fotoElegida,
                estadoAdmin: 'enviado_confirmado',
                enviadoEn: enviadoIso
            };

            const workerKey = getAdminWorkerKey(ced);
            if (workerKey && window.state.workers[workerKey]) {
                const bonoKey = `qr_${tipoBono}_${Date.now()}`;
                updates[`workers/${workerKey}/bonosAsignados/${bonoKey}`] = {

        window.aceptarBonoTrabajador = function(bonoKey, cedulaParam = null) {
            const ced = normalizarCedulaAdmin(cedulaParam || window.state.currentUser?.cedula);
            const workerKey = getAdminWorkerKey(ced);
            if (!workerKey || !bonoKey) return;

            const workerActual = window.state.workers[workerKey];
            if (!workerActual) return;

            const bonos = workerActual.bonosAsignados || {};
            const bono = bonos[bonoKey];
            if (!bono || bono.aceptado === true) return;

            const montoBono = Number((parseFloat(bono.monto) || 0).toFixed(2));
            const saldoAnterior = parseFloat(workerActual.saldo) || 0;
            const nuevoSaldo = Number((saldoAnterior + montoBono).toFixed(2));

            const movimientosActuales = Array.isArray(workerActual.movimientos)
                ? [...workerActual.movimientos]
                : (workerActual.movimientos && typeof workerActual.movimientos === 'object'
                    ? Object.values(workerActual.movimientos)
                    : []);

            movimientosActuales.unshift({
                id: 'mov_bono_' + Date.now(),
                descripcion: bono.nombre || 'Bono aceptado',
                monto: montoBono,
                tipo: 'ingreso',
                fecha: new Date().toLocaleDateString('es-VE'),
                referencia: 'REF-BONO-' + Math.floor(100000 + Math.random() * 900000)
            });

            const updates = {};
            updates[`workers/${workerKey}/bonosAsignados/${bonoKey}/aceptado`] = true;
            updates[`workers/${workerKey}/bonosAsignados/${bonoKey}/aceptadoEn`] = new Date().toISOString();
            updates[`workers/${workerKey}/saldo`] = nuevoSaldo;
            updates[`workers/${workerKey}/movimientos`] = movimientosActuales;

            window.fb.update(window.fb.ref(window.fb.db), updates).then(() => {
                window.showToast('¡Bono aceptado y acreditado en billetera!', 'success');
                window.render();
            }).catch((err) => {
                window.showToast('Error al aceptar bono: ' + err.message, 'error');
            });
        };

        function obtenerTasaKambioMoneda(moneda) {
            if (moneda === 'USD') return Number(window.state.tasaBcv) || 36.20;
            if (moneda === 'EUR') return Number(window.state.tasaEuroBcv) || 39.50;
            if (moneda === 'USDT') return Number(window.state.tasaUsdt) || 36.80;
            return 1;

        function convertirMontoKambio(monto, desdeMoneda) {
            const val = parseFloat(monto);
            const limpio = isNaN(val) || val < 0 ? 0 : val;
            const enBs = desdeMoneda === 'BS' ? limpio : limpio * obtenerTasaKambioMoneda(desdeMoneda);
            return {
                BS: enBs,
                USD: enBs / obtenerTasaKambioMoneda('USD'),
                EUR: enBs / obtenerTasaKambioMoneda('EUR'),
                USDT: enBs / obtenerTasaKambioMoneda('USDT')
            };
        }

            const workerKey = getAdminWorkerKey(cedula);
            const pago = window.state.pagosCredito[pagoId];
            if (!pago) return;
            pago.estatus = estatusNuevo;
            const credits = window.state.credits[workerKey] || window.state.credits[cedula] || [];
            if (estatusNuevo === 'Pagado') {
                if (pago.tipoPago === 'Total') credits.forEach(c => { if (c.estatus === 'Aprobado') c.estatus = 'Pagado'; });
                else { const credAprobado = credits.find(c => c.estatus === 'Aprobado'); if (credAprobado) credAprobado.estatus = 'Cuota Abonada / Pagada'; }

                                        <div class="text-sm font-black app-title">Bonos Enviados</div>
                                    </div>
                                    <span class="px-2.5 py-1 rounded-xl bg-emerald-600/15 border border-emerald-600/35 text-emerald-700 dark:text-emerald-300 text-[10px] font-mono font-bold">
                                        ${enviadosQR.length}
                                    </span>
                                </div>

                                ${enviadosQR.length === 0 ? `
                                    <div class="text-xs app-muted py-2">Aún no hay bonos enviados desde ValidaFuturo.</div>
                                ` : `
                                    <div class="space-y-2.5 max-h-96 overflow-y-auto pr-0.5">
                                        ${enviadosQR.map(item => {
                                            const abierto = window.state.bonoEnviadoSeleccionadoId === item.id;
                                            return `
                                                <div class="app-subcard rounded-2xl p-3.5 space-y-2.5">
                                                    <div class="flex items-center justify-between gap-2">
                                                        <div onclick="window.toggleDetalleBonoEnviado('${item.id}')" class="min-w-0 flex-1 cursor-pointer">
                                                            <div class="text-xs font-extrabold app-title truncate">${item.bono}</div>
                                                            <div class="text-[11px] font-mono app-accent font-bold mt-0.5">${Number(item.monto || 0).toLocaleString('es-VE', { minimumFractionDigits: 2 })} Bs. · Enviado</div>
                                                        </div>
                                                        <div class="flex items-center gap-1.5 shrink-0">
                                                            <button type="button" onclick="window.toggleDetalleBonoEnviado('${item.id}')" class="app-btn-secondary px-2.5 h-8 rounded-xl text-[10px] font-extrabold cursor-pointer">
                                                                ${abierto ? 'Ocultar' : 'Ver'}
                                                            </button>
                                                            <button type="button" onclick="window.solicitarEliminarSolicitudValidaFuturo('${item.tipoBono}', '${item.cedula}', '${item.pushKey}', '${item.nombreCompleto.replace(/'/g, '')}')" class="app-touch w-8 h-8 rounded-xl bg-rose-600/15 border border-rose-500/35 text-rose-700 dark:text-rose-300 flex items-center justify-center text-xs cursor-pointer" title="Eliminar registro">
                                                                <i class="fa-solid fa-trash-can"></i>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    ${abierto ? `
                                                        <div class="pt-2.5 border-t border-slate-200 dark:border-white/10 space-y-2.5">
                                                            <div class="text-xs app-muted">
                                                                Enviado a: <b class="app-title">${item.nombreCompleto}</b> <span class="font-mono app-accent font-bold">(${item.cedula})</span>
                                                            </div>
                                                            ${item.fotoBono ? `
                                                                <div class="rounded-2xl overflow-hidden border border-slate-300 dark:border-white/10 bg-black/50 max-h-48 flex items-center justify-center">
                                                                    <img src="${item.fotoBono}" alt="Imagen del bono enviado" class="max-h-48 object-contain">
                                                                </div>
                                                            ` : `<div class="text-[11px] app-muted">Sin imagen adjunta.</div>`}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `}
                            </div>

                            <form id="formSendBonus" class="app-surface p-4 rounded-3xl space-y-3">
                                <div class="text-xs font-black app-accent uppercase">Asignar Bono Directo</div>
                                <select id="bonoDestino" class="app-input w-full rounded-2xl px-3.5 text-xs">
                                    <option value="todos">Todos (Masa)</option>
                                    ${workers.map(w => `<option value="${w.cedula}">${w.nombre} (${w.cedula})</option>`).join('')}
                                </select>
                                <input type="text" id="bonoNombre" required placeholder="Nombre del bono" class="app-input w-full rounded-2xl px-4 text-xs font-semibold">
                                <input type="text" id="bonoMonto" oninput="window.formatCurrencyInput(this)" required placeholder="Monto (Bs.) 0,00" class="app-input w-full rounded-2xl px-4 text-xs font-mono font-bold">
                                <textarea id="bonoDetalles" required rows="2" placeholder="Detalles..." class="app-input w-full rounded-2xl p-3.5 text-xs"></textarea>
                                <input type="file" id="bonoImagen" accept="image/*" required class="w-full text-[11px] app-muted file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 app-btn-secondary file:font-bold cursor-pointer">
                                <button type="submit" class="app-btn-primary w-full rounded-2xl text-xs font-black uppercase tracking-wider cursor-pointer">Enviar Bono</button>
                            </form>
                        ` : ''}

                        ${adminTab === 'creditos' ? `
                            <div class="app-banner">
                                <i class="fa-solid fa-hand-holding-dollar text-5xl opacity-15 absolute right-3 bottom-2"></i>
                                <div class="text-base font-black">CrediFuturo</div>
                                <div class="text-xs text-white/90 mt-0.5">Solicitudes de crédito de trabajadores</div>
                            </div>

                            <div class="space-y-2.5">
                                ${Object.keys(credits).length === 0 ? `
                                    <div class="app-surface p-6 rounded-2xl text-center text-xs app-muted">No hay solicitudes.</div>
                                ` : Object.keys(credits).map(workerKey => {
                                    const worker = window.state.workers[workerKey] || { nombre: 'Trabajador' };
                                    const cedulaMostrar = worker.cedula || workerKey;
                                    return credits[workerKey].map((c, idx) => `
                                        <div class="app-surface p-4 rounded-2xl space-y-2.5">
                                            <div class="flex justify-between items-start gap-2">
                                                <div>
                                                    <div class="text-xs font-extrabold app-title">${worker.nombre} ${worker.apellido || ''}</div>
                                                    <div class="text-[11px] font-mono app-muted">${cedulaMostrar}</div>
                                                </div>
                                                <span class="app-chip text-xs font-black font-mono px-2.5 py-1 rounded-xl">${c.monto.toLocaleString('es-VE', { minimumFractionDigits: 2 })} Bs.</span>
                                            </div>
                                            <div class="text-xs app-muted">${c.concepto} · <b class="app-title">${c.estatus}</b></div>
                                            <div class="grid grid-cols-2 gap-2 pt-1">
                                                <button type="button" onclick="window.updateCreditStatus('${cedulaMostrar}', ${idx}, 'Aprobado')" class="app-touch rounded-xl bg-emerald-600/15 border border-emerald-600/35 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold cursor-pointer">Aprobar</button>
                                                <button type="button" onclick="window.updateCreditStatus('${cedulaMostrar}', ${idx}, 'Rechazado')" class="app-touch rounded-xl bg-rose-600/15 border border-rose-500/35 text-rose-700 dark:text-rose-300 text-xs font-extrabold cursor-pointer">Rechazar</button>
                                            </div>
                                        </div>
                                    `).join('');
                                }).join('')}
                            </div>
                        ` : ''}

                        ${adminTab === 'pagosAdmin' ? `
                            <div class="app-banner">
                                <i class="fa-solid fa-receipt text-5xl opacity-15 absolute right-3 bottom-2"></i>
                                <div class="text-base font-black">Validar Pagos</div>
                                <div class="text-xs text-white/90 mt-0.5">Comprobantes reportados de crédito</div>
                            </div>

                            <div class="space-y-2.5">
                                ${Object.keys(pagosCredito).length === 0 ? `
                                    <div class="app-surface p-6 rounded-2xl text-center text-xs app-muted">No hay pagos reportados.</div>
                                ` : Object.keys(pagosCredito).map(pId => {
                                    const p = pagosCredito[pId];
                                    const workerKey = getAdminWorkerKey(p.cedula);
                                    const w = window.state.workers[workerKey] || { nombre: 'Trabajador' };
                                    return `
                                        <div class="app-surface p-4 rounded-2xl space-y-2.5">
                                            <div class="flex justify-between items-start gap-2">
                                                <div>
                                                    <div class="text-xs font-extrabold app-title">${w.nombre} (${p.cedula})</div>
                                                    <div class="text-[11px] app-accent font-bold">${p.tipoPago}</div>
                                                </div>
                                                <span class="app-chip text-xs font-black font-mono px-2.5 py-1 rounded-xl">${p.monto.toLocaleString('es-VE', { minimumFractionDigits: 2 })} Bs.</span>
                                            </div>
                                            <div class="text-[11px] font-mono app-muted flex justify-between items-center gap-2">
                                                <span>Ref: ${p.referencia}</span>
                                                <a href="${p.captura}" download="comprobante_${p.referencia}.jpg" target="_blank" class="app-accent font-extrabold underline">Comprobante</a>
                                            </div>
                                            <div class="grid grid-cols-2 gap-2 pt-1">
                                                <button type="button" onclick="window.adminValidarPagoCredito('${pId}', '${p.cedula}', 'Pagado')" class="app-touch rounded-xl bg-emerald-600/15 border border-emerald-600/35 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold cursor-pointer">Aprobar</button>
                                                <button type="button" onclick="window.adminValidarPagoCredito('${pId}', '${p.cedula}', 'Rechazado')" class="app-touch rounded-xl bg-rose-600/15 border border-rose-500/35 text-rose-700 dark:text-rose-300 text-xs font-extrabold cursor-pointer">Rechazar</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        ` : ''}

                        ${adminTab === 'constanciasAdmin' ? `
                            <div class="app-banner">
                                <i class="fa-solid fa-file-invoice text-5xl opacity-15 absolute right-3 bottom-2"></i>
                                <div class="text-base font-black">Constancias</div>
                                <div class="text-xs text-white/90 mt-0.5">Emisión de constancias laborales en PDF</div>
                            </div>

                            <div class="space-y-2.5">
                                ${workers.every(w => !w.solicitudesConstancia || w.solicitudesConstancia.length === 0) ? `
                                    <div class="app-surface p-6 rounded-2xl text-center text-xs app-muted">Sin solicitudes pendientes.</div>
                                ` : workers.map(w => {
                                    const sols = w.solicitudesConstancia || [];
                                    return sols.map(s => `
                                        <div class="app-surface p-4 rounded-2xl space-y-2.5">
                                            <div class="text-xs font-extrabold app-title">${w.nombre} ${w.apellido} <span class="font-mono app-accent">(${w.cedula})</span></div>
                                            <div class="text-xs app-muted">Dirigida a: <b class="app-title">${s.dirigida}</b></div>
                                            <form onsubmit="window.subirYEnviarConstanciaPDF(event, '${w.cedula}', '${s.id}')" class="space-y-2.5">
                                                <input type="file" id="fileConstancia_${s.id}" accept="application/pdf" required class="w-full text-[11px] app-muted">
                                                <button type="submit" class="app-btn-primary w-full rounded-2xl text-xs font-black uppercase tracking-wider cursor-pointer">Subir PDF</button>
                                            </form>
                                        </div>
                                    `).join('');
                                }).join('')}
                            </div>
                        ` : ''}

                        ${adminTab === 'chatsAdmin' ? `
                            <div class="app-banner">
                                <i class="fa-solid fa-comments text-5xl opacity-15 absolute right-3 bottom-2"></i>
                                <div class="text-base font-black">Chats de Soporte</div>
                                <div class="text-xs text-white/90 mt-0.5">Mensajería directa con trabajadores</div>
                            </div>

                            <div class="space-y-3">
                                ${Object.keys(chats).length === 0 ? `
                                    <div class="app-surface p-6 rounded-2xl text-center text-xs app-muted">No hay chats activos.</div>
                                ` : Object.keys(chats).map(workerKey => {
                                    const w = window.state.workers[workerKey] || { nombre: 'Trabajador', apellido: '', cedula: workerKey };
                                    const mens = chats[workerKey] || [];
                                    return `
                                        <div class="app-surface p-4 rounded-2xl space-y-3">
                                            <div class="text-xs font-extrabold app-title">${w.nombre} ${w.apellido} <span class="font-mono app-accent">(${w.cedula || workerKey})</span></div>
                                            <div class="max-h-36 overflow-y-auto space-y-1.5 p-2.5 app-subcard rounded-2xl">
                                                ${mens.map(m => `
                                                    <div class="flex ${m.remitente === 'admin' ? 'justify-end' : 'justify-start'}">
                                                        <div class="px-3 py-2 rounded-2xl text-[11px] max-w-[82%] ${m.remitente === 'admin' ? 'app-btn-primary' : 'app-btn-secondary'}">${m.texto}</div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                            <form onsubmit="window.adminEnviarMensajeChat(event, '${w.cedula || workerKey}')" class="flex gap-2">
                                                <input type="text" id="adminChatInput_${w.cedula || workerKey}" required placeholder="Responder..." class="app-input flex-1 rounded-2xl px-3.5 text-xs">
                                                <button type="submit" class="app-btn-primary px-4 rounded-2xl text-xs font-black cursor-pointer shrink-0">Enviar</button>
                                            </form>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        ` : ''}

                        ${adminTab === 'notificaciones' ? `
                            <div class="app-banner">
                                <i class="fa-solid fa-bell text-5xl opacity-15 absolute right-3 bottom-2"></i>
                                <div class="text-base font-black">Notificaciones</div>
                                <div class="text-xs text-white/90 mt-0.5">Enviar avisos directos a un trabajador</div>
                            </div>

                            <form id="formSendNotif" class="app-surface p-4 rounded-3xl space-y-3">
                                <select id="notifCedula" class="app-input w-full rounded-2xl px-3.5 text-xs">
                                    ${workers.map(w => `<option value="${w.cedula}">${w.nombre} (${w.cedula})</option>`).join('')}
                                </select>
                                <input type="text" id="notifTitulo" required placeholder="Título" class="app-input w-full rounded-2xl px-4 text-xs font-bold">
                                <textarea id="notifMensaje" required rows="3" placeholder="Mensaje..." class="app-input w-full rounded-2xl p-3.5 text-xs"></textarea>
                                <button type="submit" class="app-btn-primary w-full rounded-2xl text-xs font-black uppercase tracking-wider cursor-pointer">Enviar</button>
                            </form>
                        ` : ''}

                        ${adminTab === 'config' ? `
                            <div class="app-banner">
                                <i class="fa-solid fa-gear text-5xl opacity-15 absolute right-3 bottom-2"></i>
                                <div class="text-base font-black">Configuración</div>
                                <div class="text-xs text-white/90 mt-0.5">Enlaces y parámetros globales</div>
                            </div>

                            <form id="formSaveConfig" class="app-surface p-4 rounded-3xl space-y-3">
                                <div>
                                    <label class="text-[10px] app-accent font-extrabold uppercase block mb-1">URL App</label>
                                    <input type="text" id="confAppUrl" value="${configData.appDownloadUrl || 'https://play.google.com/store/apps/details?id=ubii.app'}" required class="app-input w-full rounded-2xl px-4 text-xs">
                                </div>
                                <div>
                                    <label class="text-[10px] app-accent font-extrabold uppercase block mb-1">URL WhatsApp</label>
                                    <input type="text" id="confWaUrl" value="${configData.whatsappUrl || 'https://wa.me/380947114035?s=t'}" required class="app-input w-full rounded-2xl px-4 text-xs">
                                </div>
                                <button type="submit" class="app-btn-primary w-full rounded-2xl text-xs font-black uppercase tracking-wider cursor-pointer">Guardar</button>
                            </form>
                        ` : ''}
                    </main>

                    <!-- Cajón Inferior "Más Módulos" -->
                    ${window.state.mobileMenuOpen ? `
                        <div class="fixed inset-0 z-50 flex flex-col justify-end bg-black/70 backdrop-blur-xs" onclick="window.toggleMobileMenu()">
                            <div class="app-surface rounded-t-3xl border-t p-4 pb-7 space-y-3 max-h-[75dvh] overflow-y-auto" onclick="event.stopPropagation()">
                                <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-white/10">
                                    <span class="text-xs font-black uppercase tracking-wider app-accent">Más Módulos</span>
                                    <button type="button" onclick="window.toggleMobileMenu()" class="app-btn-secondary px-3.5 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer">Cerrar</button>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    ${MOBILE_MORE_TABS.map(tabKey => {
                                        const cfg = ADMIN_TABS[tabKey];
                                        const active = adminTab === tabKey;
                                        return `
                                            <button type="button" onclick="window.setAdminTab('${tabKey}')" class="app-touch p-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-[11px] font-extrabold cursor-pointer ${active ? 'app-btn-primary' : 'app-btn-secondary'}">
                                                <i class="fa-solid ${cfg.icon} text-sm"></i>
                                                <span class="truncate max-w-full">${cfg.label}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Barra Inferior Fija Estilo App Nativa -->
                    <nav class="app-surface border-t px-2 py-1.5 grid grid-cols-5 gap-1 shrink-0 z-40">
                        ${MOBILE_BOTTOM_TABS.map(tabKey => {
                            const cfg = ADMIN_TABS[tabKey];
                            const active = adminTab === tabKey && !window.state.mobileMenuOpen;
                            return `
                                <button type="button" onclick="window.setAdminTab('${tabKey}')" class="app-touch py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 text-[10px] font-extrabold cursor-pointer ${active ? 'app-btn-primary' : 'app-muted hover:opacity-100'}">
                                    <i class="fa-solid ${cfg.icon} text-xs"></i>
                                    <span class="truncate max-w-full">${cfg.label}</span>
                                </button>
                            `;
                        }).join('')}
                        <button type="button" onclick="window.toggleMobileMenu()" class="app-touch py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 text-[10px] font-extrabold cursor-pointer ${isMoreTabActive || window.state.mobileMenuOpen ? 'app-btn-primary' : 'app-muted hover:opacity-100'}">
                            <i class="fa-solid fa-grid-2 text-xs"></i>
                            <span>Más</span>
                        </button>
                    </nav>
                </div>
            `;
        }
    </script>
</body>
</html>
